<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel AI | Reset Password</title>

    <link rel="icon" type="image/x-icon" href="assets/pixel.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="cursor-glow"></div>

    <div class="container">
        <section class="left-panel">
            <div class="left-content">
                <div class="logo">
                    <div class="logo-circle">
                        <img src="assets/pixel.png" alt="Pixel Logo" class="logo-img">
                    </div>
                    <h1>Pixel</h1>
                    <p>Reset your access and recover your workspace securely.</p>
                </div>

                <div class="feature-list">
                    <div class="feature">
                        <i class="fa-solid fa-lock"></i>
                        <span>Secure Link via Email</span>
                    </div>
                    <div class="feature">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>End-to-End Encrypted</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="right-panel">
            <div class="login-card">
                <div class="heading">
                    <h2>Reset Password</h2>
                    <p>Enter the email address associated with your account.</p>
                </div>

                <div id="authError" class="auth-error-banner" style="display: none;"></div>

                <form id="resetForm">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="resetEmail" placeholder="Email address" required>
                        </div>
                    </div>

                    <button type="submit" id="resetBtn" class="login-btn">Send Reset Link</button>
                </form>

                <p class="signup-text" style="margin-top: 24px;">
                    Remember your password? <a href="login.html">Back to Sign In</a>
                </p>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        const resetForm = document.getElementById("resetForm");
        const resetEmail = document.getElementById("resetEmail");
        const resetBtn = document.getElementById("resetBtn");
        const errorBanner = document.getElementById("authError");

        resetForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = resetEmail.value.trim();
            if (!email) return;

            try {
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

                const redirectUrl = window.location.origin + window.location.pathname.replace("forgot-password.html", "login.html");
                const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl
                });

                if (error) throw error;

                errorBanner.style.display = "block";
                errorBanner.style.borderColor = "rgba(70, 209, 96, 0.4)";
                errorBanner.style.color = "#46D160";
                errorBanner.innerHTML = "✓ Password reset link has been sent to your email!";
                resetBtn.innerHTML = "Email Sent";

            } catch (err) {
                errorBanner.style.display = "block";
                errorBanner.style.borderColor = "rgba(255, 77, 77, 0.4)";
                errorBanner.style.color = "#FF4D4D";
                errorBanner.textContent = err.message || "Failed to send reset link.";
                resetBtn.disabled = false;
                resetBtn.innerHTML = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
