<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>Sign In | Pixel AI</title>

    <link rel="icon" type="image/x-icon" href="assets/pixel.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-login">
    <main class="container">
        <section class="right-panel" aria-labelledby="loginHeading">
            <div class="login-card">
                <a class="brand" href="index.html" aria-label="Pixel AI home">
                    <img src="assets/pixel.png" alt="" width="38" height="38">
                    <span>Pixel</span><span class="brand-ai">AI</span>
                </a>

                <div class="heading">
                    <h1 id="loginHeading">Welcome back</h1>
                    <p id="loginDescription">Sign in to pick up where your ideas left off.</p>
                </div>

                <div id="authError" class="auth-error-banner" role="alert" aria-live="assertive" hidden></div>

                <form id="loginForm" novalidate>
                    <div class="input-group">
                        <label for="email">Email address</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope" aria-hidden="true"></i>
                            <input type="email" id="email" name="email" placeholder="you@example.com"
                                autocomplete="email" autocapitalize="none" spellcheck="false"
                                aria-describedby="emailError" required>
                        </div>
                        <p class="field-error" id="emailError" hidden></p>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock" aria-hidden="true"></i>
                            <input type="password" id="password" name="password" placeholder="Enter your password"
                                autocomplete="current-password" aria-describedby="passwordError" required>
                            <button type="button" id="togglePassword" class="eye-btn" aria-label="Show password"
                                aria-pressed="false" title="Show password">
                                <i class="fa-regular fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <p class="field-error" id="passwordError" hidden></p>
                    </div>

                    <div class="row">
                        <a href="forgot-password.html">Forgot password?</a>
                    </div>

                    <button type="submit" id="loginSubmit" class="login-btn">Sign In</button>
                </form>

                <form id="updatePasswordForm" novalidate hidden>
                    <div class="input-group">
                        <label for="newPassword">New password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock" aria-hidden="true"></i>
                            <input type="password" id="newPassword" name="newPassword" placeholder="At least 8 characters"
                                minlength="8" autocomplete="new-password" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmNewPassword">Confirm new password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock" aria-hidden="true"></i>
                            <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter your password"
                                minlength="8" autocomplete="new-password" required>
                        </div>
                    </div>
                    <button type="submit" class="login-btn">Update password</button>
                </form>

                <div class="divider" aria-hidden="true"><span>OR</span></div>

                <button id="googleLogin" class="google-btn" type="button">
                    <i class="fa-brands fa-google" aria-hidden="true"></i><span>Continue with Google</span>
                </button>
                <button id="guestLogin" class="guest-btn" type="button">
                    <i class="fa-solid fa-user-astronaut" aria-hidden="true"></i><span>Continue as guest</span>
                </button>

                <p class="signup-text">New to Pixel? <a href="signup.html">Create an account</a></p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth-navigation.js"></script>
    <script src="js/auth-errors.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
